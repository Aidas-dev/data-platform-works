<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ .Param "description" }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #202124;
            background: #f8f9fa;
        }
        .container { max-width: 720px; margin: 0 auto; padding: 2rem 1rem; }
        header {
            background: #4285f4;
            color: #fff;
            padding: 2rem 0;
            text-align: center;
        }
        header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        header p { opacity: 0.9; font-size: 1.1rem; }
        main { padding: 2rem 0; }
        h1, h2, h3 { color: #1a73e8; margin: 1.5rem 0 0.5rem; }
        h1 { font-size: 1.8rem; }
        h2 { font-size: 1.4rem; }
        p { margin-bottom: 1rem; }
        ul, ol { margin: 0 0 1rem 1.5rem; }
        li { margin-bottom: 0.25rem; }
        code {
            background: #e8eaed;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-size: 0.9em;
        }
        footer {
            text-align: center;
            padding: 2rem 0;
            color: #5f6368;
            font-size: 0.9rem;
            border-top: 1px solid #dadce0;
        }
        .badge {
            display: inline-block;
            background: #34a853;
            color: #fff;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>{{ .Site.Title }}</h1>
            <p>{{ .Param "description" }}</p>
            <span class="badge">Deployed via CI/CD</span>
        </div>
    </header>
    <main>
        <div class="container">
            {{ block "main" . }}{{ end }}
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; {{ now.Format "2006" }} GCP CI/CD Bucket Lab. Built with Hugo &hearts;</p>
        </div>
    </footer>
</body>
</html>
